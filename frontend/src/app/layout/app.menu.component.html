<ul class="layout-menu">
    @for (item of model(); track $index) { @if(item.visible){

    <ng-container>
        <li
            app-menuitem
            [item]="item"
            [index]="$index"
            [root]="true"
            [visible]="item.visible"
        ></li>
    </ng-container>
    } }
</ul>

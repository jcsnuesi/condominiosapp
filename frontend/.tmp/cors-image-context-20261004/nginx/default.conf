server {
    listen 9090;
    # server_name localhost;

    # Docker's embedded DNS resolves Compose service names.  Resolving the
    # upstream at request time prevents Nginx from failing its own startup
    # when the backend container has not started yet (or is recreated).
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_upstream backend:3993;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Development deployments reuse stable bundle names (main.js). Avoid
    # leaving an already-open browser on an outdated authorization menu.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.js$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Bank statements and transfer receipts are bounded again by the API.
        client_max_body_size 11m;
        proxy_read_timeout 180s;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Give Socket.IO precedence over the generic .js static-file matcher.
    # This also keeps the server-provided client endpoint usable for external
    # diagnostics and older cached frontend bundles.
    location ^~ /socket.io/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
    }
}

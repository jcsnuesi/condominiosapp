<div class="login-shell surface-ground">
    <div class="login-card-wrap">
        <div class="login-gradient-frame">
            <div class="login-card surface-card">
                <div class="text-center mb-5">
                    <span class="app-page-kicker justify-content-center mt-4">{{
                        t("auth.appName")
                    }}</span>
                    <h1>{{ t("auth.forgot.title") }}</h1>
                    <p>{{ t("auth.forgot.subtitle") }}</p>
                </div>

                <div class="mb-4">
                    <label
                        for="email"
                        class="block text-900 font-medium mb-2"
                        >{{ t("auth.login.email") }}</label
                    >
                    <input
                        id="email"
                        name="email"
                        [(ngModel)]="email"
                        type="email"
                        placeholder="{{ t('auth.login.emailPlaceholder') }}"
                        pInputText
                        class="w-full"
                    />
                </div>

                <button
                    pButton
                    pRipple
                    type="button"
                    class="w-full p-3 text-xl"
                    [label]="t('auth.forgot.submit')"
                    [loading]="loading"
                    [disabled]="loading || !email"
                    (click)="submit()"
                ></button>

                <button
                    pButton
                    pRipple
                    type="button"
                    class="w-full mt-3"
                    severity="secondary"
                    label="Volver al login"
                    (click)="goToLogin()"
                ></button>
            </div>
        </div>
    </div>
</div>

<p-toast></p-toast>

<div class="login-shell surface-ground">
    <div class="login-card-wrap">
        <div class="login-gradient-frame">
            <div class="login-card surface-card">
                <div class="text-center mb-5">
                    <span class="app-page-kicker justify-content-center mt-4">{{
                        t("auth.appName")
                    }}</span>
                    <h1>{{ t("auth.reset.title") }}</h1>
                    <p>{{ t("auth.reset.subtitle") }}</p>
                </div>

                <div class="mb-4">
                    <label
                        for="password"
                        class="block text-900 font-medium mb-2"
                        >{{ t("auth.login.password") }}</label
                    >
                    <p-password
                        inputId="password"
                        name="password"
                        [(ngModel)]="password"
                        [toggleMask]="true"
                        [feedback]="false"
                        [placeholder]="t('auth.login.passwordPlaceholder')"
                        styleClass="w-full"
                        inputStyleClass="w-full p-3"
                    ></p-password>
                    @if (password && password.length < 8) {
                        <small class="p-error block mt-2">
                            Minimo 8 caracteres.
                        </small>
                    }
                </div>

                <button
                    pButton
                    pRipple
                    type="button"
                    class="w-full p-3 text-xl"
                    [label]="t('auth.reset.submit')"
                    [loading]="loading"
                    [disabled]="loading || password.length < 8"
                    (click)="submit()"
                ></button>

                <button
                    pButton
                    pRipple
                    type="button"
                    class="w-full mt-3"
                    severity="secondary"
                    label="Volver al login"
                    (click)="goToLogin()"
                ></button>
            </div>
        </div>
    </div>
</div>

<p-toast></p-toast>

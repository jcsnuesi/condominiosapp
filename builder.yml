name: builder
services:
  mongodb:
    build:
      context: ./mongodb
      dockerfile: Dockerfile
    ports:
      - "27017:27017"
    volumes:
      - mongodb-iam-data:/data/db
    networks:
      - app-network
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminpassword123
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --username admin --password adminpassword123 --authenticationDatabase admin --eval "try { rs.status().ok } catch (e) { rs.initiate({_id: ''rs0'', members: [{_id: 0, host: ''mongodb:27017''}]}).ok }" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "3993:3993"

    networks:
      - app-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3993/api/health', (response) => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ocr-service:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    environment:
      - OCR_SERVICE_TOKEN=${OCR_SERVICE_TOKEN:?Set OCR_SERVICE_TOKEN in the root .env}
    networks:
      - app-network
    volumes:
      - ocr-models:/home/ocr
    tmpfs:
      - /tmp:size=128m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 128
    restart: unless-stopped

  frontend:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    networks:
      - app-network
    volumes:
      - uploads:/app/uploads
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongodb-iam-data:
  uploads:
  ocr-models:

networks:
  app-network:
    driver: bridge

name: builder
services:
  mongodb:
    build:
      context: ./mongodb
      dockerfile: Dockerfile
    ports:
      - "27017:27017"
    volumes:
      - mongodb-iam-data:/data/db
    networks:
      - app-network
    # environment:
    #   - MONGO_INITDB_ROOT_USERNAME=admin
    #   - MONGO_INITDB_ROOT_PASSWORD=adminpassword123
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --username admin --password adminpassword123 --authenticationDatabase admin --eval "try { rs.status().ok } catch (e) { rs.initiate({_id: ''rs0'', members: [{_id: 0, host: ''mongodb:27017''}]}).ok }" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # env_file:
    #   - ./backend/.env
    # environment:
    #   OCR_SERVICE_URL: http://ocr-service:2020
    #   OCR_SERVICE_TOKEN: ${OCR_SERVICE_TOKEN:?Set OCR_SERVICE_TOKEN in the root .env}
    #   CALL_TOKEN_SECRET: ${CALL_TOKEN_SECRET:-}
    #   CALL_INTERNAL_TOKEN: ${CALL_INTERNAL_TOKEN:-}
    ports:
      - "3993:3993"
    networks:
      - app-network
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      ocr-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3993/api/health', (response) => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ocr-service:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    # environment:
    #   - OCR_SERVICE_TOKEN=${OCR_SERVICE_TOKEN:?Set OCR_SERVICE_TOKEN in the root .env}
    networks:
      - app-network
    volumes:
      - ocr-models:/home/ocr
    tmpfs:
      - /tmp:size=128m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 128
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "9090:9090"
    networks:
      - app-network
    volumes:
      - uploads:/app/uploads
    depends_on:
      backend:
        condition: service_healthy

  call-service:
    profiles: [calls]
    build:
      context: ./call-service
    # environment:
    #   CALL_BACKEND_URL: http://backend:3993
    #   CALL_INTERNAL_TOKEN: ${CALL_INTERNAL_TOKEN:-}
    #   TURN_AUTH_SECRET: ${TURN_AUTH_SECRET:-}
    #   TURN_URLS: ${TURN_URLS:-}
    #   FRONTEND_ORIGINS: ${CALL_FRONTEND_ORIGINS:-}
    networks: [app-network]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:size=16m, mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "require('http').get('http://127.0.0.1:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  coturn:
    profiles: [calls]
    image: coturn/coturn:4.18.0-r0-alpine
    entrypoint: [/bin/sh, /etc/coturn/start.sh]
    # environment:
    #   TURN_AUTH_SECRET: ${TURN_AUTH_SECRET:-}
    #   TURN_REALM: ${TURN_REALM:-}
    #   TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - ./coturn/start.sh:/etc/coturn/start.sh:ro
      - /srv/coturn/certs:/certs:ro
    networks: [app-network]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:size=16m, mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test:
        [
          CMD-SHELL,
          "test -s /tmp/turnserver.pid && kill -0 $$(cat /tmp/turnserver.pid)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3

  schedule-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.schedule-worker
    command: ["node", "modules/schedule/worker.js"]
    # env_file:
    #   - ./backend/.env
    # environment:
    #   SCHEDULE_WORKER_INTERVAL_MS: ${SCHEDULE_WORKER_INTERVAL_MS:-1800000}
    #   SCHEDULE_MODULE_ENABLED: ${SCHEDULE_MODULE_ENABLED:-true}
    networks:
      - app-network
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    user: node
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const fs=require('fs');const t=Number(fs.readFileSync('/tmp/schedule-worker-heartbeat','utf8'));process.exit(Date.now()-t<Number(process.env.SCHEDULE_WORKER_INTERVAL_MS||1800000)+180000?0:1)",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  mongodb-iam-data:
  uploads:
  ocr-models:

networks:
  app-network:
    driver: bridge

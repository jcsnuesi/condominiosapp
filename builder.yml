name: builder
services:
  mongodb:
    build:
      context: ./mongodb
      dockerfile: Dockerfile
    ports:
      - "27017:27017"
    volumes:
      - mongodb-iam-data:/data/db
    networks:
      - app-network
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminpassword123
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --username admin --password adminpassword123 --authenticationDatabase admin --eval "try { rs.status().ok } catch (e) { rs.initiate({_id: ''rs0'', members: [{_id: 0, host: ''mongodb:27017''}]}).ok }" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "3993:3993"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://admin:adminpassword123@mongodb:27017/condominios_iam?authSource=admin&replicaSet=rs0
      - JWT_SECRET=condominiosapp-production-change-me-2026
      - FRONTEND_ORIGINS=http://localhost:9090,http://127.0.0.1:9090,http://localhost:4200,http://127.0.0.1:4200
      - SMTP_USER=jcsnuesi@gmail.com
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminpassword123
    networks:
      - app-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3993/api/health', (response) => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongodb-iam-data:

networks:
  app-network:
    driver: bridge

server {
    listen 9090;
    server_name condapp.hsantosnuesi.com;
    # server_name localhost;

    # Docker's embedded DNS resolves Compose service names.  Resolving the
    # upstream at request time prevents Nginx from failing its own startup
    # when the backend container has not started yet (or is recreated).
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_upstream backend:3993;
    set $call_upstream call-service:4000;

    #  # Security: Allow only Cloudflare IP ranges
    allow 127.0.0.1/32;
    allow ::1;
    allow 172.18.0.0/16;
    allow 173.245.48.0/20;
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 141.101.64.0/18;
    allow 108.162.192.0/18;
    allow 190.93.240.0/20;
    allow 188.114.96.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;
    allow 162.158.0.0/15;
    allow 104.16.0.0/13;
    allow 104.24.0.0/14;
    allow 172.64.0.0/13;
    allow 131.0.72.0/22;
    allow 2400:cb00::/32;
    allow 2606:4700::/32;
    allow 2803:f800::/32;
    allow 2405:b500::/32;
    allow 2405:8100::/32;
    allow 2a06:98c0::/29;
    allow 2c0f:f248::/32;
    allow 10.0.5.2/32;
    deny all;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Development deployments reuse stable bundle names (main.js). Avoid
    # leaving an already-open browser on an outdated authorization menu.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.js$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Bank statements and transfer receipts are bounded again by the API.
        client_max_body_size 11m;
        proxy_read_timeout 180s;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/tasks/[^/]+/complete$ {
        # Five maintenance evidence files, bounded individually by Multer.
        client_max_body_size 51m;
        proxy_read_timeout 180s;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/calls/internal/ {
        return 404;
    }

    location ^~ /calls/socket.io/ {
        proxy_pass http://$call_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # Give Socket.IO precedence over the generic .js static-file matcher.
    # This also keeps the server-provided client endpoint usable for external
    # diagnostics and older cached frontend bundles.
    location ^~ /socket.io/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
    }
}

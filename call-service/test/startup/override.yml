services:
  mongodb:
    image: mongo:7
    build: !reset null
    command: [mongod, --replSet, rs0, --bind_ip_all]
    ports: !reset []
    environment: !reset {}
    healthcheck:
      test: [CMD-SHELL, 'mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id: ''rs0'', members: [{_id: 0, host: ''mongodb:27017''}]}).ok }"']
      interval: 2s
  backend:
    image: node:22.23.2-alpine
    build: !reset null
    command: [node, /fixture/backend.cjs]
    volumes: !override
      - ./call-service/test/startup/backend.cjs:/fixture/backend.cjs:ro
    ports: !reset []
    depends_on: !reset {}
  coturn:
    ports: !reset []
  schedule-worker:
    environment:
      SCHEDULE_WORKER_INTERVAL_MS: '1000'
    healthcheck:
      interval: 2s
      start_period: 2s
  call-service:
    healthcheck:
      interval: 2s
      start_period: 2s

